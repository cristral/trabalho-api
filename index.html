<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimório dos Heróis - Inicio</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="background-overlay"></div>

    <div class="container">
        <header>
            <h1 class="title">⚔️ Grimório dos Heróis 🔮</h1>
            <p class="subtitle">Painel Geral de Fichas de RPG</p>
            
            <div class="header-actions">
                <button type="button" id="create-character" class="btn btn-primary">+ Criar Novo Herói</button>
            </div>
        </header>

        <main>
            <section class="card-container">
                <h2>📜 Personagens Cadastrados</h2>
                <div id="character-list" class="character-grid">
                    <!-- Os cards dos personagens vão aparecer aqui via JS -->
                </div>
            </section>
        </main>
    </div>

    <dialog id="character-dialog" class="character-dialog">
        <form id="character-form">
             <div class="dialog-header">
                <h2 id="dialog-title">Criar personagem</h2>
                <button type="button" id="close-dialog" class="btn-sm btn-delete" aria-label="Fechar">✕</button>
            </div>
            <label>Nome
                <input name="nome" type="text" maxlength="60" required>
            </label>
            <label>Classe
                <input name="classe" type="text" maxlength="60" required>
            </label>
            <div class="form-stats">
                <label>Nível
                    <input name="nivel" type="number" min="1" max="999" value="1" required>
                </label>
                <label>Pontos de vida
                    <input name="pontos_vida" type="number" min="1" max="999" value="10" required>
                </label>
            </div>
            <h3>Atributos (0–30)</h3>
            <div class="form-stats">
                <label>Força <input name="forca" type="number" min="0" max="30" value="10" required></label>
                <label>Destreza <input name="destreza" type="number" min="0" max="30" value="10" required></label>
                <label>Constituição <input name="constituicao" type="number" min="0" max="30" value="10" required></label>
                <label>Inteligência <input name="inteligencia" type="number" min="0" max="30" value="10" required></label>
                <label>Sabedoria <input name="sabedoria" type="number" min="0" max="30" value="10" required></label>
                <label>Carisma <input name="carisma" type="number" min="0" max="30" value="10" required></label>
            </div>
            <p id="form-error" class="form-error" role="alert"></p>
            <button type="submit" class="btn btn-primary">Salvar personagem</button>
        </form>
    </dialog>

    <script src="index.js"></script>
</body>
</html>
